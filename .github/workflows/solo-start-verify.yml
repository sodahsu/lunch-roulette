name: Solo Start Verify

on:
  push:
    branches:
      - task/solo-start
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Unit tests
        run: pnpm test:unit

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: E2E
        run: pnpm test:e2e
