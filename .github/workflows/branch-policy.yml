name: Branch Policy

on:
  pull_request:
    branches:
      - dev
      - main

jobs:
  enforce:
    runs-on: ubuntu-latest
    steps:
      - name: Enforce dev-first integration
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          echo "head=$HEAD_REF base=$BASE_REF"

          if [ "$BASE_REF" = "main" ] && [ "$HEAD_REF" != "dev" ]; then
            echo "::error::Production PRs to main must come from dev. Feature/task branches must target dev first."
            exit 1
          fi

          if [ "$BASE_REF" = "dev" ] && [ "$HEAD_REF" = "main" ]; then
            echo "::error::main must not be merged back into dev through a pull request."
            exit 1
          fi

          echo "Branch policy OK."
