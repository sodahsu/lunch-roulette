name: Solo Start CI

concurrency:
  group: solo-start-final-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    branches:
      - dev
      - main
  push:
    branches:
      - dev
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.30.3 --activate
          pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm exec playwright install chromium

      - name: Unit tests
        run: pnpm test:unit

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: OpenSpec strict validation
        run: pnpm dlx @fission-ai/openspec validate --all --strict --no-interactive

      - name: Install isolated PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: RLS negative tests (isolated Supabase only)
        env:
          E2E_SUPABASE_URL: ${{ secrets.E2E_SUPABASE_URL }}
          E2E_POSTGRES_URL: ${{ secrets.E2E_POSTGRES_URL }}
        run: node scripts/run-isolated-rls.mjs

      - name: Retention dry run (isolated Supabase only)
        env:
          E2E_SUPABASE_URL: ${{ secrets.E2E_SUPABASE_URL }}
          E2E_POSTGRES_URL: ${{ secrets.E2E_POSTGRES_URL }}
        run: node scripts/run-isolated-rls.mjs retention

      - name: E2E (isolated test Supabase only)
        env:
          E2E_SUPABASE_URL: ${{ secrets.E2E_SUPABASE_URL }}
          E2E_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.E2E_SUPABASE_PUBLISHABLE_KEY }}
        run: pnpm test:e2e

      - name: Upload Playwright failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: test-results
          if-no-files-found: ignore
