name: Solo Start CI

concurrency:
  group: solo-start-final-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    branches:
      - dev
      - main
  push:
    branches:
      - dev
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.30.3 --activate
          pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm exec playwright install chromium

      - name: Unit tests
        run: pnpm test:unit

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: OpenSpec strict validation
        run: pnpm dlx @fission-ai/openspec validate --all --strict --no-interactive

      # #42 尚未合併 dev 時，也不得用正式 Supabase 跑本 PR 的寫入型 E2E。
      - name: E2E (isolated Supabase required)
        env:
          VITE_SUPABASE_URL: ${{ secrets.E2E_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.E2E_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          node --input-type=module -e '
            const url=process.env.VITE_SUPABASE_URL; const key=process.env.VITE_SUPABASE_PUBLISHABLE_KEY;
            if(!url||!key) { console.error("::error::E2E requires isolated Supabase secrets; see #42"); process.exit(1); }
            let parsed; try { parsed=new URL(url); } catch { process.exit(1); }
            if(parsed.protocol!=="https:"||(!parsed.hostname.endsWith(".supabase.co")||parsed.hostname.split(".").length!==3)||parsed.hostname==="hvaxoopyccwsqmhjnibg.supabase.co") {
              console.error("::error::Unsafe E2E Supabase target"); process.exit(1);
            }
          '
          pnpm test:e2e

      - name: Upload Playwright failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: test-results
          if-no-files-found: ignore
